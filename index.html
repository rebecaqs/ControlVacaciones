<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacaciones de mañana</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #5d6b7c;
    --line: #dfe3e8; --accent: #2b6cb0; --accent-soft: #e6f0fa;
    --ok: #2f855a; --err: #b83232; --err-soft: #fbeaea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --card: #1b222b; --text: #e8edf3; --muted: #9aa8b8;
      --line: #2d3744; --accent: #6aa9e9; --accent-soft: #1f3248;
      --ok: #68d391; --err: #f08a8a; --err-soft: #3a2020;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .drop {
    display: block; text-align: center; cursor: pointer;
    border: 2px dashed var(--line); border-radius: 12px;
    padding: 28px 16px; color: var(--muted);
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .drop strong { color: var(--text); }
  .drop input { display: none; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  label.f { color: var(--muted); font-size: .9rem; }
  input[type=date] {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  button {
    font: inherit; color: var(--accent); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  h2 { font-size: 1.1rem; margin: 0 0 12px; text-transform: capitalize; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--line);
  }
  li:first-child { border-top: 0; }
  .chip {
    font-size: .8rem; color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; padding: 2px 10px; white-space: nowrap;
  }
  .nadie { color: var(--ok); margin: 0; }
  .meta { color: var(--muted); font-size: .85rem; margin: 12px 0 0; }
  .error { background: var(--err-soft); color: var(--err); border-radius: 8px; padding: 12px; }
  .privacy { color: var(--muted); font-size: .85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Vacaciones de mañana</h1>
  <p class="sub">Elige el Excel de vacaciones y te digo quién está de vacaciones al día siguiente.</p>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="archivo" accept=".xlsx,.xlsm">
      <strong>Elige el Excel</strong> o arrástralo aquí<br>
      <span id="nombreArchivo">Aún no has elegido ningún archivo</span>
    </label>
    <div class="row">
      <label class="f" for="fecha">Fecha a consultar</label>
      <input type="date" id="fecha">
      <button type="button" id="btnManana">Mañana</button>
    </div>
  </div>

  <div id="error" class="error" role="alert" hidden></div>

  <div id="resultado" class="card" hidden>
    <h2 id="titulo"></h2>
    <ul id="lista"></ul>
    <p class="nadie" id="nadie" hidden>Nadie tiene vacaciones ese día.</p>
    <p class="meta" id="meta"></p>
  </div>

  <p class="privacy">El archivo se lee en tu navegador y no se sube a ningún sitio. Esta página no contiene datos de nadie.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/*
 * vacaciones.js — lógica para localizar quién tiene vacaciones en una fecha.
 *
 * Es la misma lógica que vacaciones_manana.py, pero para el navegador.
 * No depende de la página: recibe filas y celdas combinadas ya leídas del
 * Excel, así que también se puede probar desde Node.
 *
 * Estructura esperada de la hoja (índices en base 0):
 *   fila 1 -> nombre del mes en celdas combinadas ("SEPTIEMBRE")
 *   fila 3 -> número de día del mes
 *   fila 4+ -> una fila por persona (col A = departamento, C = persona,
 *              D = horas trabajadas), calendario desde la columna J.
 *   "V" en el calendario = vacaciones.
 */
(function (root) {
  "use strict";

  const MESES = [
    "ENERO", "FEBRERO", "MARZO", "ABRIL", "MAYO", "JUNIO",
    "JULIO", "AGOSTO", "SEPTIEMBRE", "OCTUBRE", "NOVIEMBRE", "DICIEMBRE",
  ];

  // Ajusta estas constantes si cambia la plantilla del Excel.
  const CFG = {
    filaMeses: 1,
    filaNumDia: 3,
    primeraFilaPersonas: 4,
    colDepartamento: 0,
    colPersona: 2,
    colHoras: 3,
    codigoVacaciones: "V",
    filasVaciasParaParar: 5,
  };

  function normalizar(texto) {
    if (texto === null || texto === undefined) return "";
    return String(texto)
      .trim()
      .toUpperCase()
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "");
  }

  function letraColumna(indice0) {
    let n = indice0 + 1;
    let s = "";
    while (n > 0) {
      const r = (n - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function bloquesDeMes(rows, merges) {
    const bloques = [];
    for (const m of merges || []) {
      if (m.s.r === CFG.filaMeses && m.e.r === CFG.filaMeses) {
        const valor = (rows[m.s.r] || [])[m.s.c];
        bloques.push({ ini: m.s.c, fin: m.e.c, mes: normalizar(valor) });
      }
    }
    bloques.sort((a, b) => a.ini - b.ini);
    return bloques;
  }

  function tieneBloquesDeMes(datos) {
    return bloquesDeMes(datos.rows, datos.merges).some((b) => MESES.includes(b.mes));
  }

  /** Elige la hoja del calendario: primero las que se llaman "vacaciones",
   *  después cualquier hoja que tenga los bloques de meses. */
  function elegirHoja(nombres, getDatos) {
    const porNombre = nombres.filter((n) => normalizar(n).includes("VACACIONES"));
    const resto = nombres.filter((n) => !porNombre.includes(n));
    for (const n of porNombre.concat(resto)) {
      if (tieneBloquesDeMes(getDatos(n))) return n;
    }
    throw new Error(
      "No se encontró ninguna hoja con el calendario de vacaciones (hojas del libro: " +
        nombres.join(", ") + ")."
    );
  }

  function localizarColumnaDia(datos, fecha, anioHoja) {
    const nombreMes = MESES[fecha.getMonth()];
    const candidatos = bloquesDeMes(datos.rows, datos.merges).filter((b) => b.mes === nombreMes);
    if (candidatos.length === 0) {
      throw new Error("No se encontró el mes '" + nombreMes + "' en la hoja.");
    }

    let bloque;
    if (fecha.getFullYear() === anioHoja) {
      bloque = candidatos[0];
    } else if (fecha.getFullYear() === anioHoja + 1) {
      // 1 de enero del año siguiente: bloque extra de ENERO al final.
      bloque = candidatos[candidatos.length - 1];
    } else {
      throw new Error(
        "La fecha " + fecha.toLocaleDateString("es-ES") +
        " no corresponde al año de la hoja (" + anioHoja + ")."
      );
    }

    const filaDias = datos.rows[CFG.filaNumDia] || [];
    for (let c = bloque.ini; c <= bloque.fin; c++) {
      if (Number(filaDias[c]) === fecha.getDate()) return c;
    }
    throw new Error("No se encontró el día " + fecha.getDate() + " en el bloque de " + nombreMes + ".");
  }

  function personasConVacaciones(datos, columna) {
    const resultado = [];
    let deptoActual = null;
    let vacias = 0;

    for (let r = CFG.primeraFilaPersonas; r < datos.rows.length; r++) {
      const fila = datos.rows[r] || [];
      const horas = fila[CFG.colHoras];
      const esPersona = typeof horas === "number" && isFinite(horas);

      if (esPersona) {
        vacias = 0;
        const depto = fila[CFG.colDepartamento];
        if (depto) deptoActual = String(depto);

        const valor = fila[columna];
        if (typeof valor === "string" && valor.trim().toUpperCase() === CFG.codigoVacaciones) {
          resultado.push({
            persona: String(fila[CFG.colPersona]),
            departamento: deptoActual,
          });
        }
      } else {
        vacias++;
        if (vacias >= CFG.filasVaciasParaParar) break; // lo que sigue es la leyenda
      }
    }
    return resultado;
  }

  function calcular(datos, fecha, anioHoja) {
    const columna = localizarColumnaDia(datos, fecha, anioHoja);
    return { columna: letraColumna(columna), personas: personasConVacaciones(datos, columna) };
  }

  const api = { MESES, CFG, elegirHoja, calcular, letraColumna };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.Vacaciones = api;
})(typeof self !== "undefined" ? self : this);

</script>
<script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  let libro = null;
  let nombreArchivo = "";

  function isoLocal(d) {
    const p = (n) => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function ponerManana() {
    const d = new Date();
    d.setDate(d.getDate() + 1);
    $("fecha").value = isoLocal(d);
    mostrar();
  }

  function datosHoja(nombre) {
    const ws = libro.Sheets[nombre];
    if (!ws["!ref"]) return { rows: [], merges: [] };
    const fin = XLSX.utils.decode_range(ws["!ref"]).e;
    const rows = XLSX.utils.sheet_to_json(ws, {
      header: 1, defval: null, raw: true, range: { s: { r: 0, c: 0 }, e: fin },
    });
    return { rows, merges: ws["!merges"] || [] };
  }

  function mostrarError(msg) {
    $("resultado").hidden = true;
    $("error").textContent = msg;
    $("error").hidden = false;
  }

  function mostrar() {
    if (!libro) return;
    $("error").hidden = true;

    const [y, m, d] = $("fecha").value.split("-").map(Number);
    if (!y) return mostrarError("Elige una fecha válida.");
    const fecha = new Date(y, m - 1, d);

    try {
      const hoja = Vacaciones.elegirHoja(libro.SheetNames, datosHoja);
      const anio = Number((hoja + " " + nombreArchivo).match(/20\d{2}/)?.[0]) || fecha.getFullYear();
      const { columna, personas } = Vacaciones.calcular(datosHoja(hoja), fecha, anio);

      $("titulo").textContent = fecha.toLocaleDateString("es-ES", {
        weekday: "long", day: "numeric", month: "long", year: "numeric",
      });
      const ul = $("lista");
      ul.replaceChildren();
      for (const p of personas) {
        const li = document.createElement("li");
        const nombre = document.createElement("span");
        nombre.textContent = p.persona;
        li.appendChild(nombre);
        if (p.departamento) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = p.departamento;
          li.appendChild(chip);
        }
        ul.appendChild(li);
      }
      $("nadie").hidden = personas.length > 0;
      $("meta").textContent = "Hoja «" + hoja + "», columna " + columna + ".";
      $("resultado").hidden = false;
    } catch (e) {
      mostrarError(e.message);
    }
  }

  async function leer(archivo) {
    if (!archivo) return;
    try {
      const buf = await archivo.arrayBuffer();
      libro = XLSX.read(buf, { type: "array" });
      nombreArchivo = archivo.name;
      $("nombreArchivo").textContent = archivo.name;
      mostrar();
    } catch (e) {
      libro = null;
      mostrarError("No se pudo leer el archivo. ¿Es un .xlsx válido y no está protegido con contraseña?");
    }
  }

  $("archivo").addEventListener("change", (e) => leer(e.target.files[0]));
  $("fecha").addEventListener("change", mostrar);
  $("btnManana").addEventListener("click", ponerManana);

  const drop = $("drop");
  ["dragenter", "dragover"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => leer(e.dataTransfer.files[0]));

  ponerManana();
</script>
</body>
</html>
