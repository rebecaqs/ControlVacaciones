<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vacaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --fg: #22201c;
    --muted: #8b867c;
    --line: #e9e4db;
    --accent: #e8643c;
    --accent-soft: #fdeee8;
    --shadow: 0 1px 2px rgba(34,32,28,.04), 0 8px 24px rgba(34,32,28,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413;
      --card: #1e1d1b;
      --fg: #f0ede7;
      --muted: #8f8a80;
      --line: #2c2a27;
      --accent: #ff7a50;
      --accent-soft: #2e1f19;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 600px; margin: 0 auto; padding: 56px 20px 80px; }

  header { margin-bottom: 32px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--accent);
  }
  .eyebrow::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  h1 {
    font-family: Fraunces, Georgia, serif;
    font-weight: 600;
    font-size: clamp(34px, 8vw, 46px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 12px 0 10px;
  }
  .sub { color: var(--muted); margin: 0; font-size: 15px; }

  .drop {
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border: 1.5px dashed var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
    font-size: 14px; color: var(--muted);
  }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop .icon {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 20px; font-weight: 600;
  }
  .drop strong { color: var(--fg); font-weight: 500; display: block; }
  .drop input { display: none; }
  .msg { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .err { color: #d6452d; }

  #result { margin-top: 28px; }

  /* tira de la semana */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 18px; }
  .day {
    border: none; background: transparent; color: var(--fg);
    border-radius: 14px; padding: 10px 0 8px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-family: inherit; transition: background .15s;
  }
  .day:hover { background: var(--card); }
  .day .dow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .day .num { font-size: 18px; font-weight: 600; }
  .day .dots { height: 6px; display: flex; gap: 3px; margin-top: 2px; }
  .day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .day.sel { background: var(--fg); color: var(--bg); }
  .day.sel .dow { color: inherit; opacity: .65; }
  .day.sel .dots i { background: var(--bg); }

  /* tarjeta principal */
  .panel {
    background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
    padding: 26px 24px 8px;
  }
  .panel-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .rel { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  .full {
    font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 500;
    text-transform: capitalize; margin-top: 2px; line-height: 1.2;
  }
  .badge {
    flex: none; min-width: 54px; height: 54px; border-radius: 16px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; text-align: center;
    font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 600; line-height: 1;
  }
  .badge small { display: block; font-family: Inter, sans-serif; font-size: 9px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
  .picker-row { margin: 14px 0 6px; }
  .picker-row input {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    font: inherit; font-size: 13px; border-radius: 10px; padding: 5px 10px; cursor: pointer;
  }

  ul { list-style: none; margin: 14px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .avatar {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 14px; letter-spacing: .02em;
  }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 13px; color: var(--muted); }
  .empty { padding: 30px 0 26px; text-align: center; color: var(--muted); border-top: 1px solid var(--line); margin-top: 14px; }
  .empty .big { font-family: Fraunces, Georgia, serif; font-size: 20px; color: var(--fg); margin-bottom: 4px; }

  footer { margin-top: 36px; font-size: 12px; color: var(--muted); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <span class="eyebrow">Equipo</span>
    <h1>¿Quién está de vacaciones?</h1>
    <p class="sub">Carga el Excel y consulta cualquier día. Todo se procesa en tu navegador.</p>
  </header>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv">
    <div class="icon">↑</div>
    <div id="dropText"><strong>Elige el Excel</strong>o arrástralo hasta aquí</div>
  </label>
  <div class="msg" id="msg" hidden></div>

  <section id="result" hidden>
    <div class="week" id="week"></div>
    <div class="panel">
      <div class="panel-top">
        <div>
          <div class="rel" id="rel"></div>
          <div class="full" id="full"></div>
        </div>
        <div class="badge" id="badge"></div>
      </div>
      <div class="picker-row"><input type="date" id="picker" aria-label="Elegir fecha"></div>
      <ul id="list"></ul>
    </div>
  </section>

  <footer>Columnas esperadas: Nombre + Inicio/Fin (o una sola Fecha por fila).</footer>
</main>

<script>
const $ = id => document.getElementById(id);
let records = [];
let current = addDays(startOfDay(new Date()), 1); // por defecto: mañana

/* ---------- fechas ---------- */
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function iso(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function fmtShort(d) { return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); }
function sameDay(a, b) { return a.getTime() === b.getTime(); }

function toDate(v) {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') {
    const p = XLSX.SSF.parse_date_code(v);
    return p ? new Date(p.y, p.m - 1, p.d) : null;
  }
  if (v instanceof Date) return startOfDay(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m) {
    const y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
    return new Date(y, +m[2] - 1, +m[1]);
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}

/* ---------- lectura del Excel ---------- */
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
const KEYS = {
  name:  ['nombre', 'persona', 'empleado', 'empleada', 'name', 'trabajador', 'equipo', 'miembro'],
  start: ['inicio', 'desde', 'start', 'from', 'fecha inicio', 'fecha de inicio', 'primer dia'],
  end:   ['fin', 'hasta', 'end', 'to', 'fecha fin', 'fecha de fin', 'ultimo dia'],
  date:  ['fecha', 'dia', 'date', 'vacaciones']
};
function findCol(headers, keys) {
  for (const k of keys) { const i = headers.findIndex(h => h === k); if (i >= 0) return i; }
  return headers.findIndex(h => keys.some(k => h.includes(k)));
}
function parseWorkbook(wb) {
  const out = [];
  for (const sheetName of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true, defval: '' });
    let hi = -1, cols = null;
    for (let r = 0; r < Math.min(rows.length, 15); r++) {
      const h = rows[r].map(norm);
      const name = findCol(h, KEYS.name), start = findCol(h, KEYS.start),
            end = findCol(h, KEYS.end), date = findCol(h, KEYS.date);
      if (name >= 0 && (start >= 0 || date >= 0)) { hi = r; cols = { name, start, end, date }; break; }
    }
    if (hi < 0) continue;
    for (let r = hi + 1; r < rows.length; r++) {
      const row = rows[r];
      const name = String(row[cols.name] ?? '').trim();
      if (!name) continue;
      const s = toDate(row[cols.start >= 0 ? cols.start : cols.date]);
      if (!s) continue;
      const e = cols.end >= 0 ? (toDate(row[cols.end]) || s) : s;
      out.push({ name, start: s, end: e < s ? s : e });
    }
  }
  return out;
}
async function loadFile(file) {
  const msg = $('msg');
  msg.hidden = false; msg.className = 'msg'; msg.textContent = 'Leyendo…';
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    records = parseWorkbook(wb);
    if (!records.length) throw new Error('No encuentro columnas de nombre y fechas. Revisa las cabeceras del Excel.');
    $('dropText').innerHTML = `<strong>✓ ${file.name}</strong>Pulsa para cambiar de archivo`;
    msg.hidden = true;
    $('result').hidden = false;
    render();
  } catch (err) {
    msg.className = 'msg err';
    msg.textContent = err.message || 'No se pudo leer el archivo.';
    $('result').hidden = true;
  }
}

/* ---------- pintado ---------- */
const COLORS = ['#e8643c', '#3d8b7a', '#6b7fd7', '#c9578a', '#d49a2a', '#4a9bc4', '#8e6bbf', '#5f9a4f'];
function colorFor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return COLORS[h % COLORS.length];
}
function initials(name) {
  const parts = name.split(/\s+/).filter(Boolean);
  return ((parts[0]?.[0] || '') + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}
const peopleOn = d => records.filter(r => r.start <= d && d <= r.end);

function renderWeek() {
  const wk = $('week');
  wk.innerHTML = '';
  for (let i = -3; i <= 3; i++) {
    const d = addDays(current, i);
    const n = peopleOn(d).length;
    const b = document.createElement('button');
    b.className = 'day' + (i === 0 ? ' sel' : '');
    b.innerHTML = `<span class="dow">${d.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.', '')}</span>
      <span class="num">${d.getDate()}</span>
      <span class="dots">${'<i></i>'.repeat(Math.min(n, 3))}</span>`;
    b.onclick = () => { current = d; render(); };
    wk.append(b);
  }
}

function render() {
  const today = startOfDay(new Date());
  const diff = Math.round((current - today) / 86400000);
  $('rel').textContent = diff === 0 ? 'Hoy' : diff === 1 ? 'Mañana' : diff === -1 ? 'Ayer'
    : diff > 0 ? `En ${diff} días` : `Hace ${-diff} días`;
  $('full').textContent = current.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  $('picker').value = iso(current);
  renderWeek();

  const people = peopleOn(current).sort((a, b) => a.name.localeCompare(b.name, 'es'));
  $('badge').innerHTML = people.length ? `${people.length}<small>${people.length === 1 ? 'persona' : 'personas'}</small>` : '0';

  const list = $('list');
  list.innerHTML = '';
  if (!people.length) {
    list.innerHTML = '<div class="empty"><div class="big">Equipo al completo</div>Nadie de vacaciones este día.</div>';
    return;
  }
  for (const p of people) {
    const li = document.createElement('li');
    const av = document.createElement('div'); av.className = 'avatar';
    av.style.background = colorFor(p.name); av.textContent = initials(p.name);
    const who = document.createElement('div'); who.className = 'who';
    const b = document.createElement('b'); b.textContent = p.name;
    const sp = document.createElement('span');
    sp.textContent = sameDay(p.start, p.end) ? fmtShort(p.start) : `${fmtShort(p.start)} – ${fmtShort(p.end)}`;
    who.append(b, sp);
    li.append(av, who);
    list.append(li);
  }
}

/* ---------- eventos ---------- */
$('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]));
$('picker').onchange = e => { const d = toDate(e.target.value); if (d) { current = d; render(); } };
</script>
</body>
</html>
